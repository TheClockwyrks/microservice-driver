# This repository's own jobs in the kit's gates stage (azure-pipelines.yml
# includes this file there). Two families:
#
#   - THE BINARY JOBS, on every run: each release-builds the driver crate,
#     runs its tests and doctests at that profile, and smoke-runs the `tcab`
#     binary it produced (scripts/ci/release-build.sh, release-test.sh,
#     release-doctest.sh, binary-smoke.sh), on Linux in the Rust image and on a
#     hosted Windows agent. On a `v*` tag each keeps the smoke-tested binary as
#     the run's `tcab-linux` or `tcab-windows` artifact, which is how a release
#     of `tcab` is published (see "Releasing" at
#     https://docs.testcabinet.ai/development/releasing/).
#   - THE AUDIO STORE JOBS, on master and staging: the audio store the driver
#     image bakes, built natively per architecture by
#     scripts/ci/audio-store-image.sh and pushed as
#     `test-cabinet-audio-store:<commit>-<arch>`, then fused into the multi-arch
#     `test-cabinet-audio-store:<commit>`. The kit's image stage waits on this
#     stage, so the driver image, whose Dockerfile takes the audio store at
#     this commit (`AUDIO_STORE_IMAGE`), finds it pushed. Staging it presigns
#     reads of the private audio object store with the pipeline's secret
#     variables CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_AUDIO_R2_BUCKET,
#     CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID and
#     CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY, and reads the sample packs
#     from microservice-backend (scripts/lib/siblings.mjs).
#
# Every registry login retries, as does every manifest fuse: both are a handful
# of registry round trips that are safe to repeat. The builds do not retry: a
# build that failed has a reason in its log.

parameters:
  # The Rust CI image the kit's Rust track runs in.
  - name: rustImage
    type: string
  - name: registry
    type: string
  # The Docker Registry service connection holding AcrPush on the registry.
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

jobs:
  - job: binary_linux
    displayName: "Binary: release build & smoke (linux)"
    timeoutInMinutes: 120
    container:
      image: ${{ parameters.rustImage }}
      endpoint: ${{ parameters.registryEndpoint }}
    # The repositories the workspace's manifests reach, in the job token's
    # scope for scripts/ci/git-sources.sh.
    uses:
      repositories:
        - contracts
        - engines
        - tool-audio-core
        - tool-model-core
        - tool-sprite
        - tool-voxel
    variables:
      CARGO_HOME: $(Pipeline.Workspace)/ci-cache/cargo-home
      CARGO_INCREMENTAL: 0
      # Retries the pull of the CI image, whose registry token exchange has
      # timed out on a hosted agent.
      VSTSAGENT_DOCKER_ACTION_RETRIES: "true"
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Restore the cargo home
        inputs:
          key: 'cargo-home | v2 | "$(Agent.OS)" | rust-toolchain.toml | **/Cargo.toml, !**/target/**'
          restoreKeys: |
            cargo-home | v2 | "$(Agent.OS)" | rust-toolchain.toml
          path: $(Pipeline.Workspace)/ci-cache/cargo-home
      - task: Cache@2
        displayName: Restore the release build output
        inputs:
          key: 'cargo-target-release | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
          restoreKeys: |
            cargo-target-release | v1 | "$(Agent.OS)" | rust-toolchain.toml
          path: target
      - script: scripts/ci/git-sources.sh
        displayName: Fetch the project's dependencies from Azure
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
        displayName: Authenticate npm to the package feed
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      # The driver's tests drive a browser through the workspace's Playwright.
      - script: npm ci
        displayName: Install the npm workspace
      - script: scripts/ci/release-build.sh
        displayName: Release build
      - script: scripts/ci/release-test.sh
        displayName: Release tests
      - script: scripts/ci/release-doctest.sh
        displayName: Release doctests
      - script: scripts/ci/binary-smoke.sh
        displayName: Smoke
      - script: |
          set -euo pipefail
          mkdir -p tcab-dist
          cp target/release/tcab tcab-dist/
        displayName: Stage the tcab binary
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
      - publish: tcab-dist
        artifact: tcab-linux
        displayName: Publish tcab
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
      - script: scripts/ci/prune-target.sh target
        displayName: Prune the build output to what the next build reads
        condition: succeededOrFailed()

  - job: binary_windows
    displayName: "Binary: release build & smoke (windows)"
    timeoutInMinutes: 120
    pool:
      vmImage: windows-2022
    uses:
      repositories:
        - contracts
        - engines
        - tool-audio-core
        - tool-model-core
        - tool-sprite
        - tool-voxel
    variables:
      # A CARGO_HOME under the workspace, so the cache has a path the agent
      # can name (the predefined $(HOME) is not set on Windows agents).
      CARGO_HOME: $(Pipeline.Workspace)/ci-cache/cargo-home
      CARGO_INCREMENTAL: 0
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Restore the cargo home
        inputs:
          key: 'cargo-home | v2 | "$(Agent.OS)" | rust-toolchain.toml | **/Cargo.toml, !**/target/**'
          restoreKeys: |
            cargo-home | v2 | "$(Agent.OS)" | rust-toolchain.toml
          path: $(Pipeline.Workspace)/ci-cache/cargo-home
      - task: Cache@2
        displayName: Restore the release build output
        inputs:
          key: 'cargo-target-release | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
          restoreKeys: |
            cargo-target-release | v1 | "$(Agent.OS)" | rust-toolchain.toml
          path: target
      # `bash` is Git Bash on a Windows agent, so the Linux job's scripts run
      # here unchanged.
      - bash: scripts/ci/git-sources.sh
        displayName: Fetch the project's dependencies from Azure
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - script: rustup show
        displayName: Show the Rust toolchain
      - bash: scripts/ci/install-nextest.sh
        displayName: Install cargo-nextest
      - bash: scripts/ci/release-build.sh
        displayName: Release build
      - bash: scripts/ci/release-test.sh
        displayName: Release tests
      - bash: scripts/ci/release-doctest.sh
        displayName: Release doctests
      - bash: scripts/ci/binary-smoke.sh
        displayName: Smoke
      # Staged inside the checkout, because Git Bash would have to translate
      # the staging directory's drive-letter path.
      - bash: |
          set -euo pipefail
          mkdir -p tcab-dist
          cp target/release/tcab.exe tcab-dist/
        displayName: Stage the tcab binary
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
      - publish: tcab-dist
        artifact: tcab-windows
        displayName: Publish tcab
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
      - bash: scripts/ci/prune-target.sh target
        displayName: Prune the build output to what the next build reads
        condition: succeededOrFailed()

  - ${{ each arch in split('amd64,arm64', ',') }}:
      - job: audiostore_${{ arch }}
        displayName: "Audio store (${{ arch }})"
        dependsOn:
          - checks
        condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
        timeoutInMinutes: 60
        pool:
          ${{ if eq(arch, 'amd64') }}:
            vmImage: ubuntu-24.04
          ${{ else }}:
            name: ${{ parameters.arm64Pool }}
        variables:
          # The Node the dev container pins (scripts/ci/provision-node.sh).
          NODE_VERSION: 24.16.0
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - ${{ if eq(arch, 'amd64') }}:
              - script: scripts/ci/free-disk-linux.sh
                displayName: Reclaim agent disk
          - script: scripts/ci/provision-node.sh "$(Pipeline.Workspace)/node"
            displayName: Provision Node
          - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
            displayName: Authenticate npm to the package feed
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - script: npm ci
            displayName: Install the npm workspace the stager runs from
          - task: Docker@2
            displayName: Log in to the registry
            retryCountOnTaskFailure: 2
            inputs:
              command: login
              containerRegistry: ${{ parameters.registryEndpoint }}
          - script: scripts/ci/audio-store-image.sh "$(Build.SourceVersion)"
            displayName: Build and push the audio store (${{ arch }})
            env:
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
              CLOUDFLARE_AUDIO_R2_BUCKET: $(CLOUDFLARE_AUDIO_R2_BUCKET)
              CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID: $(CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID)
              CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY: $(CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY)

  - job: audiostore_manifest
    displayName: "Audio store: the multi-arch tag"
    dependsOn:
      - audiostore_amd64
      - audiostore_arm64
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Docker@2
        displayName: Log in to the registry
        retryCountOnTaskFailure: 2
        inputs:
          command: login
          containerRegistry: ${{ parameters.registryEndpoint }}
      - script: scripts/ci/manifest.sh "$(Build.SourceVersion)" test-cabinet-audio-store
        displayName: Fuse the architectures
        retryCountOnTaskFailure: 2
        env:
          IMAGE_REGISTRY: ${{ parameters.registry }}
