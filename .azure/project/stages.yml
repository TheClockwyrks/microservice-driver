# This repository's own stages, after the kit's publish stage
# (azure-pipelines.yml includes this file there).
#
# THE RUN IMAGES, on master and staging once every gate passed: every image
# containers/image-names.sh lists, built natively per architecture by
# scripts/ci/run-images.sh, each `-gg` variant gated on `gg selfcheck` before
# its push, and pushed as `test-cabinet-<name>:<commit>-<arch>`; the last job
# fuses each pair into the multi-arch `test-cabinet-<name>:<commit>` that
# TCAB_CONTAINER_TAG pins. An image whose inputs digest
# (scripts/ci/run-image-inputs.sh) names a pushed image is retagged rather than
# rebuilt. The tool images the run images copy from are the `tool-*`
# repositories' own, at the commits containers/tool-images.toml pins, and
# scripts/ci/tool-images.sh check runs before any build. The adversarial and
# performance images fetch the engines repository at the commit Cargo.lock
# resolves, and the performance image's training scenarios come from the
# test-suites repository's public mirror (scripts/ci/lattice-training.sh), so
# the stage fetches nothing through the job's token.

parameters:
  - name: rustImage
    type: string
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

stages:
  - stage: runimages
    displayName: Run-container images
    dependsOn: gates
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    jobs:
      - ${{ each arch in split('amd64,arm64', ',') }}:
          - job: runimages_${{ arch }}
            displayName: "Run-container images (${{ arch }})"
            timeoutInMinutes: 360
            pool:
              ${{ if eq(arch, 'amd64') }}:
                vmImage: ubuntu-24.04
              ${{ else }}:
                name: ${{ parameters.arm64Pool }}
            steps:
              - checkout: self
                fetchDepth: 1
                clean: true
              # BOTH legs: this job builds every run image on one agent, and
              # it is the one that ran out of disk on both architectures. The
              # arm64 pool hands every job a fresh VM, so host-wide removals
              # lose nothing there. The script says what it touches and why.
              - script: scripts/ci/free-disk-linux.sh
                displayName: Reclaim agent disk
              - task: Docker@2
                displayName: Log in to the registry
                retryCountOnTaskFailure: 2
                inputs:
                  command: login
                  containerRegistry: ${{ parameters.registryEndpoint }}
              - script: |
                  set -euo pipefail
                  scripts/ci/report-disk.sh "before the run images"
                  scripts/ci/run-images.sh "$(Build.SourceVersion)"
                displayName: Build, self-check and push the run images
              # Whatever the build did, on the way out: run-images.sh sets PUSH
              # and RECLAIM, and this reading says the reclaim held rather
              # than merely ran.
              - script: scripts/ci/report-disk.sh "after the run images"
                displayName: Disk after the run images
                condition: always()

      - job: runimages_manifest
        displayName: "Run-container images: the multi-arch tags"
        dependsOn:
          - runimages_amd64
          - runimages_arm64
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - task: Docker@2
            displayName: Log in to the registry
            retryCountOnTaskFailure: 2
            inputs:
              command: login
              containerRegistry: ${{ parameters.registryEndpoint }}
          # The set a run resolves. The gg toolchain image the `-gg` variants
          # copy is gg's pipeline's, multi-arch already.
          - script: |
              set -euo pipefail
              mapfile -t images < <(./containers/image-names.sh | sed 's/^/test-cabinet-/')
              scripts/ci/manifest.sh "$(Build.SourceVersion)" "${images[@]}"
            displayName: Fuse the architectures
            retryCountOnTaskFailure: 2
            env:
              IMAGE_REGISTRY: ${{ parameters.registry }}
