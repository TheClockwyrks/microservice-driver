# The commit of each `tool-*` repository whose image the run images copy their tool
# binaries from: `testcabinet.azurecr.io/<repository>:<commit>`, which that
# repository's pipeline pushes on every gated push to its master and staging.
#
# scripts/ci/tool-images.sh reads this file, and is the only reader. A repository
# added here needs a run image whose Dockerfile declares the build argument its name
# derives (`TOOL_SPRITE_IMAGE` for `tool-sprite`). Each line is one repository and a
# full commit, in this shape and no other, because a shell script parses it.
#
# The driver links `test-cabinet-draw` from tool-sprite and `test-cabinet-voxel`
# from tool-voxel, so those two repositories are in Cargo.lock as well, and
# `scripts/ci/tool-images.sh lock` holds each pin here to the commit the lock
# resolves: a run image carries the tool the driver was built and tested against.
# Bump the two together: `cargo update -p test-cabinet-draw` (or
# `-p test-cabinet-voxel`), then the line here.
